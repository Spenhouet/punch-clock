name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bunx vitest --run
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
        env:
          CI: '1'
